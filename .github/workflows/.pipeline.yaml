name: Testa CI Pipeline
on: 
  push: 
    branches: [main]
  pull_request: 
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@4
        with:
          node-vesion: 20
      
      - name: Install dependencies
        uses: npm Install
      
      - name: Run build
        uses: npm run build